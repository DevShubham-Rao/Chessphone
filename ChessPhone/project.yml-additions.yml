# Merge into project.yml (XcodeGen). Existing keys you already have are not repeated.

options:
  deploymentTarget:
    iOS: "17.0"        # was 16.0. Meta's docs/samples disagree on the minimum (15.2 / 17.0 / 17.2):
                       # check the SDK's Package.swift for the real number and use that.

packages:
  ChessKitEngine:
    url: https://github.com/chesskit-app/chesskit-engine
    from: 0.2.0
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "1.0.0"      # use the newest tag at github.com/facebook/meta-wearables-dat-ios/tags
                       # (note: "from: 0.9.0" would stop below 1.0.0)

targets:
  ChessPhone:
    dependencies:
      - package: ChessKitEngine
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
    info:
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.buildertest.chessphone
            CFBundleURLSchemes: [chessphone]
        MWDAT:
          AppLinkURLScheme: "chessphone://"
          MetaAppID: "0"          # Developer Mode doesn't attest the app; real values come from the
          ClientToken: "0"        # Wearables Developer Center when you use a release channel.
          TeamID: "YOUR_APPLE_TEAM_ID"
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: "Connects to your Ray-Ban Meta glasses."
        NSLocalNetworkUsageDescription: "Streams the glasses camera over Wi-Fi."
        NSBonjourServices: ["_bonjour._tcp"]
        NSCameraUsageDescription: "Photographs the chessboard (iPhone camera test mode)."
