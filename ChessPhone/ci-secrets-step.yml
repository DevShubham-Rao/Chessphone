# GitHub Actions: write Resources/Secrets.plist from a repository secret just before building,
# so the key never lives in git. Add GEMINI_API_KEY under Settings > Secrets and variables > Actions.
# Put this step BEFORE the xcodegen / xcodebuild steps in .github/workflows/ios-build.yml.
      - name: Write Secrets.plist
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :GEMINI_API_KEY string $GEMINI_API_KEY" Resources/Secrets.plist
