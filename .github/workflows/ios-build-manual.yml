name: ChessPhone iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ChessPhone.xcodeproj \
            -scheme ChessPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/ChessPhone.app dist/Payload/
          cd dist && zip -qr ChessPhone.ipa Payload && rm -rf Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ChessPhone-ipa
          path: dist/ChessPhone.ipa
